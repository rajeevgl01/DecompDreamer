    "A DSLR photo of a galloping brown horse",
    "A high quality photo of a blue cap",
    "A high quality photo of a medieval sword",
    "A DSLR photo of the Imperial State Crown of England.",
    "A DSLR photo of a sitting princess, wearing a flowing gown"
  ]
  prompt_obj_neg: [
    "a cap, a sword, a brown horse, arms not in high gaurd stance, no forearms and hands, wearing a helmet",
    "a knight in shining armor, knight's legs",
    "The head of knight",
    "A knight's arm, and hand, no weapon like shape, no sharp blade, very big and thick",
    "A head of princess",
    "a knight, a horse, a crown"
  ]
  prompt_edge: {
    "[0, 1]": "A knight galloping a brown horse",
